<svg viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <style type="text/css">
      .text-base {
        font-family: 'Share Tech Mono', monospace;
        font-size: 130px;
        font-weight: lighter;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .text-cyber {
        fill: rgba(6, 182, 212, 0);
        stroke: #06b6d4;
        stroke-width: 1.5;
        stroke-dasharray: 400;
        stroke-dashoffset: 400;
        animation:
          drawIn 3s cubic-bezier(0.4, 0, 0.2, 1) forwards,
          pulseGlow 4s ease-in-out infinite 3s;
      }
      .text-glitch {
        fill: none;
        stroke: #ef4444;
        stroke-width: 1;
        opacity: 0;
        animation: glitchTrigger 6s infinite;
      }
      @keyframes drawIn {
        80% {
          fill: rgba(6, 182, 212, 0);
        }
        100% {
          stroke-dashoffset: 0;
          fill: rgba(6, 182, 212, 0.15);
          filter: url(#glow-cyan);
        }
      }
      @keyframes pulseGlow {
        0%, 100% {
          filter: drop-shadow(0 0 2px rgba(6, 182, 212, 0.6));
        }
        50% {
          filter: drop-shadow(0 0 10px rgba(6, 182, 212, 0.9));
          stroke: #22d3ee;
        }
      }

      @keyframes glitchTrigger {
        0%, 92%, 96%, 100% {
          opacity: 0;
          transform: translate(0, 0);
        }
        93% {
          opacity: 0.8;
          transform: translate(-3px, 2px);
          stroke-dasharray: 50;
        }
        95% {
          opacity: 0.5;
          transform: translate(4px, -1px);
          stroke-dasharray: 20;
        }
        97% {
          opacity: 0.8;
          transform: translate(-2px, -2px);
        }
      }
    </style>
  </defs>
  <image href="coffe.gif" x="50" y="0" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" />
  <g transform="translate(600, 75)">

    <text class="text-base text-cyber">Cl0udS3c</text>

    <text class="text-base text-glitch" filter="url(#glow-red)">Cl0udS3c</text>
  </g>
</svg>
